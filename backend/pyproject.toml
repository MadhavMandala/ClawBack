[project]
name = "clawback"
version = "0.0.1"
description = "ClawBack backend: finds subscriptions you pay for but don't use, and helps you cancel or downgrade them."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "openai>=1.40",          # Nebius Token Factory is OpenAI-compatible
    "tavily-python>=0.5",
    "httpx>=0.27",           # Nylas and Plaid REST calls (no vendor SDKs)
    "python-dotenv>=1.0",
    "pypdf>=5.0",            # text from PDF receipts (pure Python)
    "pypdfium2>=4.30",       # render scanned PDF receipts to an image (native; optional at runtime, imported lazily)
    "pillow>=10.0",          # resize receipt images and save rendered pages (native; optional at runtime)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clawback*"]

[tool.setuptools.package-data]
"clawback.rules" = ["*.json", "README.md"]  # the rules data must ship with a non-editable install

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["evals: checks on the synthetic eval set in backend/evals (offline, about a second)"]
