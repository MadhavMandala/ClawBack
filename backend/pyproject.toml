[project]
name = "clawback"
version = "0.0.1"
description = "ClawBack backend: finds subscriptions you pay for but don't use, and helps you cancel or downgrade them."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "openai>=1.40",          # Nebius Token Factory is OpenAI-compatible
    "tavily-python>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clawback*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
