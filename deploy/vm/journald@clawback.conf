# Log retention for ClawBack only. setup.sh and update.sh copy this to /etc/systemd/journald@clawback.conf.
# The API and the nightly job write to their own journal namespace (LogNamespace=clawback in both units), so this
# 14-day limit, which the privacy policy promises, leaves every other service's logs alone.
# Read the logs with: journalctl --namespace=clawback -u clawback

[Journal]
MaxRetentionSec=14day
